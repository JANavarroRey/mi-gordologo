<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="Mi Gordólogo">
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
  </defs>
  <!-- Character bust -->
  <g transform="translate(8,8)">
    <!-- Coat / torso -->
    <path d="M22 88c0-18 12-28 34-28s34 10 34 28v16H22z" fill="url(#coat)" stroke="#16a34a" stroke-width="2"/>
    <!-- Collar -->
    <path d="M42 76l14 20 14-20" fill="none" stroke="#15803d" stroke-width="2"/>
    <!-- Head -->
    <circle cx="56" cy="42" r="26" fill="#f5d0a9"/>
    <!-- Hair / beard -->
    <path d="M34 40c2-22 16-30 44-28 4 10 2 22-2 28-8 4-18 6-28 4-6-1-12-2-14-4z" fill="#6b7280"/>
    <path d="M36 52c4 18 14 26 20 26s16-8 20-26c-8 6-24 6-40 0z" fill="#9ca3af"/>
    <!-- Glasses -->
    <circle cx="46" cy="42" r="8" fill="none" stroke="#374151" stroke-width="2.5"/>
    <circle cx="66" cy="42" r="8" fill="none" stroke="#374151" stroke-width="2.5"/>
    <path d="M54 42h4" stroke="#374151" stroke-width="2.5"/>
    <!-- Eyes -->
    <circle cx="46" cy="42" r="2.2" fill="#111827"/>
    <circle cx="66" cy="42" r="2.2" fill="#111827"/>
    <!-- Smile -->
    <path d="M48 54c4 4 12 4 16 0" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <!-- Lemon in hand -->
    <ellipse cx="92" cy="92" rx="14" ry="10" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" transform="rotate(-18 92 92)"/>
    <path d="M92 82c2-4 6-5 8-4" fill="none" stroke="#65a30d" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="90" cy="90" rx="3" ry="1.5" fill="#fde047" opacity=".7" transform="rotate(-18 90 90)"/>
  </g>
  <!-- Wordmark -->
  <text x="120" y="52" font-family="Nunito, Segoe UI, sans-serif" font-size="28" fill="#14532d">
    <tspan font-weight="600">Mi </tspan><tspan font-weight="800">Gordólogo</tspan>
  </text>
  <text x="122" y="78" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#16a34a">Adelgaza sin comer</text>
</svg>
